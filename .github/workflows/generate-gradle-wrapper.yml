name: Generate Gradle Wrapper Files

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate-wrapper:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Generate and verify official Gradle Wrapper files
        shell: bash
        run: |
          set -euo pipefail

          # Generate wrapper scripts and JAR using the official Gradle
          # distribution installed by setup-gradle.
          gradle wrapper --gradle-version 9.3.1 --distribution-type bin

          test -s gradlew
          test -s gradlew.bat
          test -s gradle/wrapper/gradle-wrapper.jar
          test -s gradle/wrapper/gradle-wrapper.properties
          test -x gradlew

          grep -Fq 'gradle-9.3.1-bin.zip' gradle/wrapper/gradle-wrapper.properties

          # Run the generated wrapper to verify it launches Gradle 9.3.1.
          ./gradlew --version | tee wrapper-version.txt
          grep -Fq 'Gradle 9.3.1' wrapper-version.txt

          # Keep the existing properties file out of the download artifact:
          # the requested manual commit is only the three missing files.
          tar -czf gradle-wrapper-files.tar.gz \
            gradlew \
            gradlew.bat \
            gradle/wrapper/gradle-wrapper.jar

      - name: Upload generated wrapper files
        uses: actions/upload-artifact@v4
        with:
          name: gradle-wrapper-files
          path: gradle-wrapper-files.tar.gz
          if-no-files-found: error
          retention-days: 7
