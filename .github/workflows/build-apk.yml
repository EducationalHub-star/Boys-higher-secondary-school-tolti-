name: Build School APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.3.1

      - name: Run unit tests
        run: gradle :app:testDebugUnitTest --no-daemon

      - name: Build APK
        run: gradle assembleDebug --no-daemon

      - name: Verify APK integrity, DEX, signature, package and minSdk
        shell: bash
        run: |
          set -euo pipefail

          APK="app/build/outputs/apk/debug/app-debug.apk"

          echo "Checking APK file..."
          test -s "$APK"

          echo "Checking ZIP integrity..."
          unzip -t "$APK" > /dev/null

          echo "Checking APK internal files and DEX checksums..."
          python3 - "$APK" <<'EOF'
          import hashlib
          import re
          import struct
          import sys
          import zipfile
          import zlib

          apk_path = sys.argv[1]

          with zipfile.ZipFile(apk_path, "r") as zf:
              assert zf.testzip() is None, f"Corrupted ZIP entry: {zf.testzip()}"

              names = zf.namelist()
              assert "AndroidManifest.xml" in names, "AndroidManifest.xml missing"
              assert "resources.arsc" in names, "resources.arsc missing"

              dex_names = sorted(
                  name for name in names
                  if re.match(r"^classes\\d*\\.dex$", name)
              )
              assert dex_names, "No DEX files found"

              for name in dex_names:
                  data = zf.read(name)
                  assert len(data) >= 112, f"{name} is too small"
                  assert data[:4] == b"dex\n", f"Invalid DEX magic: {name}"

                  adler, = struct.unpack_from("<I", data, 8)
                  file_size, = struct.unpack_from("<I", data, 32)

                  assert file_size == len(data), f"{name} file size mismatch"
                  assert hashlib.sha1(data[32:]).digest() == data[12:32], \
                      f"{name} SHA-1 checksum mismatch"
                  assert (zlib.adler32(data[12:]) & 0xFFFFFFFF) == adler, \
                      f"{name} Adler32 checksum mismatch"

              print("APK ZIP integrity verified")
              print(f"Verified {len(dex_names)} DEX files:")
              print(dex_names)
          EOF

          echo "Using Android SDK tools..."
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"

          if [ -z "$SDK_ROOT" ]; then
            echo "ERROR: Android SDK not found"
            exit 1
          fi

          BUILD_TOOLS_DIR=$(find "$SDK_ROOT/build-tools" \
            -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)

          if [ -z "$BUILD_TOOLS_DIR" ]; then
            echo "ERROR: Android Build Tools not found"
            exit 1
          fi

          echo "Using Android Build Tools: $BUILD_TOOLS_DIR"

          echo "Verifying APK signature..."
          "$BUILD_TOOLS_DIR/apksigner" verify --verbose --print-certs "$APK"

          echo "Checking package name..."
          BADGING=$("$BUILD_TOOLS_DIR/aapt2" dump badging "$APK")

          echo "$BADGING" | grep -E \
            "package:|sdkVersion:|targetSdkVersion:|native-code:"
          echo "$BADGING" | grep -q "package: name='com.aistudio.kasurumaltok.vzrkx'"

          echo "Checking minimum SDK using apkanalyzer..."
          APK_ANALYZER=$(find "$SDK_ROOT" -type f -name apkanalyzer | head -n 1)

          if [ -z "$APK_ANALYZER" ]; then
            echo "ERROR: apkanalyzer not found"
            exit 1
          fi

          MIN_SDK=$("$APK_ANALYZER" manifest min-sdk "$APK")

          echo "APK Minimum SDK: $MIN_SDK"

          if [ "$MIN_SDK" != "23" ]; then
            echo "ERROR: Expected minSdk 23, got $MIN_SDK"
            exit 1
          fi

          echo "APK verification completed successfully"

      - name: Generate SHA256
        run: |
          set -e
          cd app/build/outputs/apk/debug
          sha256sum app-debug.apk > app-debug.apk.sha256
          sha256sum -c app-debug.apk.sha256
          cat app-debug.apk.sha256

      - name: Upload verified APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: CampusConnect-Verified-APK
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/debug/app-debug.apk.sha256
          compression-level: 0
          if-no-files-found: error
